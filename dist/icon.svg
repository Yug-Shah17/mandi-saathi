<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c1f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Subtle Balance Scale Pillar (Agri-Fintech Fairness) -->
  <path d="M256 120 L256 390" stroke="rgba(255,255,255,0.18)" stroke-width="12" stroke-linecap="round"/>
  <path d="M190 390 L322 390" stroke="rgba(255,255,255,0.22)" stroke-width="12" stroke-linecap="round"/>

  <!-- Interlocking Golden Scales Beam -->
  <path d="M140 180 Q256 160 372 180" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#shadow)"/>

  <!-- Left Scale Pan (Farm Sprout / Produce) -->
  <line x1="140" y1="180" x2="110" y2="270" stroke="#fef3c7" stroke-width="4" stroke-opacity="0.8"/>
  <line x1="140" y1="180" x2="170" y2="270" stroke="#fef3c7" stroke-width="4" stroke-opacity="0.8"/>
  <path d="M96 270 Q140 295 184 270 Z" fill="url(#leafGrad)" filter="url(#shadow)"/>
  <!-- Leaf inside left pan -->
  <path d="M140 215 C130 235 125 255 140 268 C155 255 150 235 140 215 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Right Scale Pan (Rupee / Net Profit Realization) -->
  <line x1="372" y1="180" x2="342" y2="250" stroke="#fef3c7" stroke-width="4" stroke-opacity="0.8"/>
  <line x1="372" y1="180" x2="402" y2="250" stroke="#fef3c7" stroke-width="4" stroke-opacity="0.8"/>
  <path d="M328 250 Q372 275 416 250 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <!-- Rupee Symbol glowing in right pan -->
  <text x="372" y="242" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">₹</text>

  <!-- Crown Sprout on Center Fulcrum -->
  <circle cx="256" cy="165" r="14" fill="#fbbf24"/>
  <path d="M256 160 C245 130 220 120 200 130 C205 155 235 160 256 165 Z" fill="url(#leafGrad)"/>
  <path d="M256 160 C267 130 292 120 312 130 C307 155 277 160 256 165 Z" fill="url(#leafGrad)"/>
</svg>

